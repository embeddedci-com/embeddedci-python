name: PIC16LF1937
id: "2401"
family: PIC16F193x
voltage: {min_mv: 2100, max_mv: 5500, erase_min_mv: 2700}
chip_erase_only: true
notes: "data EEPROM is not written: how an XC8 .hex lays it out (0x1E000) is not verified"
prog:
  cmd_set: 6bit
  ee_erase: true
  cp: {addr: 0x1000E, bit: 7, protected_when: 0}
mem:
  flash: {size: 16384, page: 16, addr: 0, hex: 0, align: 16}
  config: {size: 4, page: 2, addr: 0x1000E, hex: 0x1000E, align: 2}
  user: {size: 8, page: 2, addr: 0x10000, hex: 0x10000, align: 2}
