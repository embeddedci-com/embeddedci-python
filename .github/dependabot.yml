# Weekly version updates, one grouped PR per ecosystem. Security updates arrive on their own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directories:
      - /packages/embeddedci
      - /packages/embeddedci-mcp
      - /packages/embeddedci-openhtf
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # mcp 2.x removes mcp.server.fastmcp, which embeddedci-mcp's server imports: moving to it
      # is a port, not a bump. The <2 pin still takes every 1.x fix; drop this once ported.
      - dependency-name: mcp
        versions: [">=2"]
