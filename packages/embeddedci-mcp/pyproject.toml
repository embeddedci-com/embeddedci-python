[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embeddedci-mcp"
version = "2.1.0"
description = "MCP server that lets AI agents drive an EmbeddedCI BenchPod hardware-in-the-loop bench"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "EmbeddedCI" }]
keywords = ["embedded", "hardware-in-the-loop", "mcp", "benchpod", "swd", "agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # cloud: the embeddedci:<device> destination; analysis: dominant frequency in capture summaries.
    "embeddedci[cloud,analysis]>=2.0,<3",
    "mcp>=1.12,<2",
    "anyio>=4",
    "pydantic>=2.7",
    "starlette>=0.27",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[project.scripts]
embeddedci-mcp = "embeddedci_mcp.__main__:main"

[project.urls]
Homepage = "https://www.embeddedci.com/docs/benchpod-mcp"
Repository = "https://github.com/embeddedci-com/embeddedci-python"
Issues = "https://github.com/embeddedci-com/embeddedci-python/issues"

# Inside the workspace, resolve embeddedci from the sibling source tree (see the
# repo-root pyproject.toml [tool.uv.workspace]). On PyPI this is ignored and the
# published embeddedci is used.
[tool.uv.sources]
embeddedci = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/embeddedci_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
